<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sponsor Dashboard – The Human Mosaic</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background: #f8f8f6;
      color: #111;
    }

    .container {
      width: min(1280px, 96%);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.4rem);
    }

    .subtitle {
      margin: 8px 0 0;
      color: #666;
      line-height: 1.6;
    }

    .nav-btn,
    .logout-btn,
    .filter-btn,
    .action-btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn {
      background: #111;
      color: white;
    }

    .logout-btn {
      border: 1px solid #111;
      background: white;
      color: #111;
    }

    .logout-btn:hover {
      background: #111;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 18px;
      background: white;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
    }

    .stat-label {
      margin-bottom: 8px;
      color: #666;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 800;
    }

    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .filter-btn {
      border: 1px solid #111;
      background: white;
      color: #111;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: #111;
      color: white;
    }

    .status-message {
      margin-bottom: 18px;
      color: #666;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 22px;
    }

    .card {
      overflow: hidden;
      border: 1px solid #ddd;
      border-radius: 22px;
      background: white;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.05);
    }

    .logo-wrap {
      height: 220px;
      padding: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4efe7;
      border-bottom: 1px solid #e6dfd4;
    }

    .logo-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: zoom-in;
    }

    .card-body {
      padding: 20px;
    }

    .company-name {
      margin: 0 0 12px;
      font-size: 1.35rem;
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .badge-pending {
      background: #fff4d6;
      color: #8a5a00;
    }

    .badge-approved {
      background: #e8f7ee;
      color: #18794e;
    }

    .badge-rejected {
      background: #fdecec;
      color: #b42318;
    }

    .badge-payment {
      background: #ece8ff;
      color: #4b2dbd;
    }

    .meta {
      margin-bottom: 8px;
      color: #555;
      line-height: 1.45;
      word-break: break-word;
    }

    .meta strong {
      color: #111;
    }

    .message-box {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid #ece7df;
      border-radius: 14px;
      background: #fcfbf8;
      color: #555;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .approve-btn {
      background: #111;
      color: white;
    }

    .reject-btn {
      background: #b42318;
      color: white;
    }

    .open-btn {
      border: 1px solid #111;
      background: white;
      color: #111;
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 50px 20px;
      border: 1px dashed #ccc;
      border-radius: 20px;
      background: white;
      color: #666;
      text-align: center;
    }

    @media (max-width: 700px) {
      body {
        padding: 22px 14px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <script>
    if (sessionStorage.getItem("thm_admin_authenticated") !== "true") {
      window.location.href = "admin-login.html";
    }
  </script>

  <div class="container">
    <div class="topbar">
      <div>
        <div class="topbar-left">
          <h1>Sponsor Dashboard</h1>

          <a class="nav-btn" href="admin-approvals.html">
            Photo Approvals
          </a>
        </div>

        <p class="subtitle">
          Review partnership applications, approve selected sponsors and manage request status.
        </p>
      </div>

      <button id="logoutBtn" class="logout-btn">
        Logout
      </button>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Pending</div>
        <div id="countPending" class="stat-value">—</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Approved</div>
        <div id="countApproved" class="stat-value">—</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Rejected</div>
        <div id="countRejected" class="stat-value">—</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Total Requests</div>
        <div id="countTotal" class="stat-value">—</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-status="pending">
        Pending
      </button>

      <button class="filter-btn" data-status="approved">
        Approved
      </button>

      <button class="filter-btn" data-status="rejected">
        Rejected
      </button>

      <button class="filter-btn" data-status="all">
        All
      </button>
    </div>

    <div id="statusMessage" class="status-message">
      Loading sponsor requests...
    </div>

    <div id="sponsorGrid" class="grid"></div>
  </div>

  <script>
    const SUPABASE_URL =
      "https://cqpujmwfiqbwdsmuwkmb.supabase.co";

    const SUPABASE_KEY =
      "INCOLLA_QUI_LA_STESSA_ANON_KEY_DI_ADMIN_APPROVALS";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let currentStatus = "pending";
    let allRequests = [];

    const statusMessage =
      document.getElementById("statusMessage");

    const sponsorGrid =
      document.getElementById("sponsorGrid");

    const countPending =
      document.getElementById("countPending");

    const countApproved =
      document.getElementById("countApproved");

    const countRejected =
      document.getElementById("countRejected");

    const countTotal =
      document.getElementById("countTotal");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      if (!value) return "—";

      return new Intl.DateTimeFormat("en-GB", {
        dateStyle: "medium",
        timeStyle: "short",
      }).format(new Date(value));
    }

    function formatOrganizationType(value) {
      if (!value) return "—";

      return String(value)
        .replaceAll("-", " ")
        .replace(/\b\w/g, (letter) =>
          letter.toUpperCase()
        );
    }

    function updateStats() {
      countPending.textContent =
        allRequests.filter(
          (item) => item.status === "pending"
        ).length;

      countApproved.textContent =
        allRequests.filter(
          (item) => item.status === "approved"
        ).length;

      countRejected.textContent =
        allRequests.filter(
          (item) => item.status === "rejected"
        ).length;

      countTotal.textContent = allRequests.length;
    }

    function getVisibleRequests() {
      if (currentStatus === "all") {
        return allRequests;
      }

      return allRequests.filter(
        (item) => item.status === currentStatus
      );
    }

    function renderRequests() {
      const requests = getVisibleRequests();

      statusMessage.textContent =
        `${requests.length} sponsor request${requests.length === 1 ? "" : "s"} shown.`;

      if (!requests.length) {
        sponsorGrid.innerHTML = `
          <div class="empty-state">
            No sponsor requests found for this status.
          </div>
        `;

        return;
      }

      sponsorGrid.innerHTML = requests
        .map((request) => {
          const status =
            request.status || "pending";

          const paymentStatus =
            request.payment_status || "not_requested";

          const websiteUrl =
            request.website || "";

          return `
            <article class="card">
              <div class="logo-wrap">
                ${
                  request.logo_url
                    ? `
                      <img
                        src="${escapeHtml(request.logo_url)}"
                        alt="${escapeHtml(request.company)} logo"
                        onclick="window.open('${escapeHtml(request.logo_url)}', '_blank', 'noopener,noreferrer')"
                      />
                    `
                    : "No logo available"
                }
              </div>

              <div class="card-body">
                <h2 class="company-name">
                  ${escapeHtml(request.company || "Unnamed Organization")}
                </h2>

                <div class="badges">
                  <span class="badge badge-${escapeHtml(status)}">
                    ${escapeHtml(status.toUpperCase())}
                  </span>

                  <span class="badge badge-payment">
                    ${escapeHtml(paymentStatus.replaceAll("_", " ").toUpperCase())}
                  </span>
                </div>

                <div class="meta">
                  <strong>Contact:</strong>
                  ${escapeHtml(request.contact_name || "—")}
                </div>

                <div class="meta">
                  <strong>Email:</strong>
                  ${escapeHtml(request.email || "—")}
                </div>

                <div class="meta">
                  <strong>Organization:</strong>
                  ${escapeHtml(formatOrganizationType(request.organization_type))}
                </div>

                <div class="meta">
                  <strong>Country:</strong>
                  ${escapeHtml(request.country || "—")}
                </div>

                <div class="meta">
                  <strong>Room:</strong>
                  ${escapeHtml(request.preferred_room || "—")}
                </div>

                <div class="meta">
                  <strong>Placement:</strong>
                  ${escapeHtml(request.requested_placement || "—")}
                </div>

                <div class="meta">
                  <strong>Duration:</strong>
                  ${escapeHtml(request.requested_days || "—")} days
                </div>

                <div class="meta">
                  <strong>Submitted:</strong>
                  ${escapeHtml(formatDate(request.created_at))}
                </div>

                ${
                  request.message
                    ? `
                      <div class="message-box">
                        <strong>Additional Information</strong><br /><br />
                        ${escapeHtml(request.message)}
                      </div>
                    `
                    : ""
                }

                <div class="actions">
                  ${
                    websiteUrl
                      ? `
                        <a
                          class="action-btn open-btn"
                          href="${escapeHtml(websiteUrl)}"
                          target="_blank"
                          rel="noopener noreferrer"
                        >
                          Open Website
                        </a>
                      `
                      : ""
                  }

                  ${
                    status === "pending"
                      ? `
                        <button
                          class="action-btn approve-btn"
                          onclick="approveRequest('${escapeHtml(request.id)}')"
                        >
                          Approve
                        </button>

                        <button
                          class="action-btn reject-btn"
                          onclick="rejectRequest('${escapeHtml(request.id)}')"
                        >
                          Reject
                        </button>
                      `
                      : ""
                  }
                </div>
              </div>
            </article>
          `;
        })
        .join("");
    }

    async function loadSponsorRequests() {
      statusMessage.textContent =
        "Loading sponsor requests...";

      const { data, error } = await supabaseClient
        .from("sponsor_requests")
        .select("*")
        .order("created_at", {
          ascending: false,
        });

      if (error) {
        console.error(
          "Load sponsor requests error:",
          error
        );

        statusMessage.textContent =
          "Unable to load sponsor requests.";

        sponsorGrid.innerHTML = `
          <div class="empty-state">
            ${escapeHtml(error.message)}
          </div>
        `;

        return;
      }

      allRequests = Array.isArray(data)
        ? data
        : [];

      updateStats();
      renderRequests();
    }

    async function approveRequest(requestId) {
      const confirmed = window.confirm(
        "Approve this partnership application?"
      );

      if (!confirmed) return;

      const { error } = await supabaseClient
        .from("sponsor_requests")
        .update({
          status: "approved",
          payment_status: "pending",
        })
        .eq("id", requestId);

      if (error) {
        console.error(
          "Approve sponsor request error:",
          error
        );

        window.alert(
          "Unable to approve this partnership application."
        );

        return;
      }

      await loadSponsorRequests();
    }

    async function rejectRequest(requestId) {
      const confirmed = window.confirm(
        "Reject this partnership application?"
      );

      if (!confirmed) return;

      const { error } = await supabaseClient
        .from("sponsor_requests")
        .update({
          status: "rejected",
        })
        .eq("id", requestId);

      if (error) {
        console.error(
          "Reject sponsor request error:",
          error
        );

        window.alert(
          "Unable to reject this partnership application."
        );

        return;
      }

      await loadSponsorRequests();
    }

    document
      .querySelectorAll(".filter-btn")
      .forEach((button) => {
        button.addEventListener("click", () => {
          currentStatus =
            button.dataset.status;

          document
            .querySelectorAll(".filter-btn")
            .forEach((item) =>
              item.classList.remove("active")
            );

          button.classList.add("active");
          renderRequests();
        });
      });

    document
      .getElementById("logoutBtn")
      .addEventListener("click", () => {
        sessionStorage.removeItem(
          "thm_admin_authenticated"
        );

        window.location.href =
          "admin-login.html";
      });

    loadSponsorRequests();
  </script>
</body>
</html>
